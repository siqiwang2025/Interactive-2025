<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Exercise 9</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f0f0f0;
      font-family: sans-serif;
    }

    .calendar-wrapper {
      max-width: 90vw;
      width: 600px;
    }

    .calendar-container {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      padding: 10px;
      border: 2px solid #333;
      background: white;
      justify-content: center;
    }

    .label {
      text-align: center;
      font-size: 28px;
      font-weight: bold;
      color: #ff6f61;
      margin-bottom: 5px;
    }

    .day, .empty {
      flex: 1 0 13%;
      height: 60px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 16px;
      background-color: #6b5b95;
      color: white;
      border-radius: 4px;
    }

    .weekday {
      background-color: #88b04b;
      font-weight: bold;
    }

    .empty {
      background-color: transparent;
    }

    @media (max-width: 700px) {
      .day, .empty {
        flex: 1 0 20%;
        height: 50px;
        font-size: 14px;
      }
    }
  </style>
</head>
<body>

  <div class="calendar-wrapper">
    <div class="label">May</div>
    <div class="label">2025</div>

    <div class="calendar-container">
      <!-- Weekdays -->
      <div class="day weekday">Sun</div>
      <div class="day weekday">Mon</div>
      <div class="day weekday">Tue</div>
      <div class="day weekday">Wed</div>
      <div class="day weekday">Thu</div>
      <div class="day weekday">Fri</div>
      <div class="day weekday">Sat</div>

      
      <div class="empty"></div>
      <div class="empty"></div>
      <div class="empty"></div>

  
      <div class="day">1</div><div class="day">2</div><div class="day">3</div><div class="day">4</div>
      <div class="day">5</div><div class="day">6</div><div class="day">7</div><div class="day">8</div>
      <div class="day">9</div><div class="day">10</div><div class="day">11</div><div class="day">12</div>
      <div class="day">13</div><div class="day">14</div><div class="day">15</div><div class="day">16</div>
      <div class="day">17</div><div class="day">18</div><div class="day">19</div><div class="day">20</div>
      <div class="day">21</div><div class="day">22</div><div class="day">23</div><div class="day">24</div>
      <div class="day">25</div><div class="day">26</div><div class="day">27</div><div class="day">28</div>
      <div class="day">29</div><div class="day">30</div><div class="day">31</div>
      <div class="empty"></div>
    </div>
  </div>

</body>
</html>
